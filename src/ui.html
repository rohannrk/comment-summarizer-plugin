<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #fff);
        --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1a1a1a);
        --text-secondary: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #e6e6e6);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --accent-text: var(--figma-color-text-onbrand, #fff);
        --danger: var(--figma-color-text-danger, #d4380d);
        --danger-bg: var(--figma-color-bg-danger-tertiary, #fff1f0);
        --radius-lg: 16px;
        --radius-md: 10px;
        --radius-sm: 8px;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
        --cat-summary: var(--accent);
        --cat-people: #7c6cf0;
        --cat-actions: #22c55e;
        --cat-neutral: #9aa5b1;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, system-ui, sans-serif;
        font-size: 12px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      .wrap { padding: 14px; }
      h2 { font-size: 12px; margin: 0 0 8px; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      .hint { color: var(--text-secondary); font-weight: 400; font-size: 11px; }
      input:not([type="checkbox"]), select {
        width: 100%;
        padding: 7px 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      input:not([type="checkbox"]):hover, select:hover {
        border-color: color-mix(in oklch, var(--border) 40%, var(--text) 60%);
      }
      input:not([type="checkbox"]):focus-visible, select:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 25%, transparent);
      }
      input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
        flex: none;
      }
      input[type="checkbox"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button {
        border: none;
        border-radius: var(--radius-md);
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: transform 80ms ease, background 120ms ease, opacity 120ms ease;
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .primary {
        background: var(--accent); color: var(--accent-text); width: 100%;
        margin-top: 14px; padding: 11px 12px; border-radius: var(--radius-md);
      }
      .primary:hover:not(:disabled) { background: color-mix(in oklch, var(--accent) 88%, black); }
      .primary:disabled { opacity: 0.45; cursor: not-allowed; }
      .ghost { background: var(--bg-secondary); color: var(--text); border-radius: var(--radius-md); }
      .ghost:hover:not(:disabled) { background: color-mix(in oklch, var(--bg-secondary) 80%, var(--text) 8%); }
      .text-btn {
        background: none;
        color: var(--text-secondary);
        padding: 8px 4px;
        font-weight: 600;
      }
      .text-btn:hover:not(:disabled) { color: var(--text); }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .header-icon {
        width: 26px; height: 26px; border-radius: var(--radius-sm); flex: none;
        background: var(--accent); color: var(--accent-text);
        display: flex; align-items: center; justify-content: center;
      }
      .header h1 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      .header p { font-size: 11px; color: var(--text-secondary); margin: 1px 0 0; }
      .icon-btn {
        background: none;
        color: var(--text-secondary);
        width: 28px; height: 28px;
        padding: 0;
        border-radius: var(--radius-sm);
        flex: none;
        margin-left: auto;
      }
      .icon-btn:hover:not(:disabled) { background: var(--bg-secondary); color: var(--text); }
      .settings-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
      .settings-header .icon-btn { margin-left: 0; }
      .settings-header h1 { font-size: 13px; font-weight: 700; margin: 0; }
      .scope {
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        padding: 10px 12px;
        margin-bottom: 4px;
        color: var(--text-secondary);
      }
      .scope b { color: var(--text); font-weight: 600; }
      .error {
        background: var(--danger-bg);
        color: var(--danger);
        padding: 10px 12px;
        border-radius: var(--radius-md);
        margin-top: 10px;
        white-space: pre-wrap;
        line-height: 1.45;
      }
      .result {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 14px 16px;
        line-height: 1.5;
        background: var(--bg);
        box-shadow: var(--shadow-card);
      }
      .result h2 { font-size: 13px; margin: 14px 0 6px; }
      .result h2:first-child { margin-top: 0; }
      .result ul { padding-left: 18px; margin: 4px 0; }
      .result li { margin: 2px 0; }
      .result p { margin: 6px 0; }
      .toolbar { display: flex; justify-content: flex-end; margin-top: 10px; gap: 8px; }
      .spinner {
        display: inline-block; width: 14px; height: 14px; vertical-align: middle;
        border: 2px solid var(--border); border-top-color: var(--accent);
        border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { display: none !important; }
      .proof-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding: 9px 10px;
        border-radius: var(--radius-md);
        background: var(--bg-secondary);
      }
      .muted { color: var(--text-secondary); }
      .ok-text { color: var(--figma-color-text-success, #0f7b0f); white-space: pre-wrap; margin-top: 8px; }
      #testResult { font-size: 11px; }
      .preview {
        background: var(--bg-secondary);
        border-radius: var(--radius-md);
        padding: 9px 11px;
        margin-top: 10px;
        color: var(--text-secondary);
      }
      .preview b { color: var(--text); }
      .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 400; }
      .result li.task { list-style: none; margin-left: -14px; display: flex; gap: 6px; align-items: baseline; }
      /* structured card layout */
      .sec { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
      .sec:first-child { padding-top: 2px; }
      .sec:last-child { border-bottom: none; padding-bottom: 2px; }
      .sec-ic {
        width: 30px; height: 30px; border-radius: 50%; flex: none;
        display: flex; align-items: center; justify-content: center; color: #fff;
      }
      .ic-summary { background: var(--cat-summary); }
      .ic-people { background: var(--cat-people); }
      .ic-actions { background: var(--cat-actions); }
      .ic-other { background: var(--cat-neutral); }
      .sec-main { flex: 1; min-width: 0; }
      .sec-main h3 { font-size: 14px; font-weight: 700; margin: 4px 0 8px; }
      .sec-main p { margin: 4px 0; line-height: 1.5; }
      .person { display: flex; align-items: center; gap: 8px; }
      .person + .person { margin-top: 7px; }
      .avatar {
        width: 26px; height: 26px; border-radius: 50%; flex: none; color: #fff;
        font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      }
      .pname { font-weight: 700; }
      .pdash { color: var(--text-secondary); }
      .pphrase { color: var(--text-secondary); }
      .task { display: flex; align-items: center; gap: 8px; }
      .task + .task { margin-top: 8px; }
      .task .box {
        width: 20px; height: 20px; border-radius: var(--radius-sm); flex: none;
        border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; color: #fff;
      }
      .task .box.checked { background: var(--cat-actions); border-color: var(--cat-actions); }
      .task.done .tlabel { text-decoration: line-through; color: var(--text-secondary); }
    </style>
  </head>
  <body>
    <div id="app" class="wrap">
    <div id="mainView">
      <div class="header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div>
          <h1>Comment Summarizer</h1>
          <p>Turn Figma comments into a clear summary</p>
        </div>
        <button id="openSettings" class="icon-btn" aria-label="Credentials and model settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div id="scope" class="scope">Reading selection…</div>
      <input id="fileUrl" type="hidden" />

      <label class="check">
        <input id="excludeResolved" type="checkbox" />
        Ignore resolved threads
      </label>

      <label id="includeScreenshotRow" class="check hidden">
        <input id="includeScreenshot" type="checkbox" />
        <span id="includeScreenshotLabel">Include a screenshot of the selection as visual context</span> <span class="hint">(Gemini only — sends an image of your design to the LLM)</span>
      </label>

      <button id="run" class="primary" disabled>Scan comments</button>
      <div id="preview" class="preview hidden"></div>

      <div id="error" class="error hidden"></div>
      <div id="status" class="muted hidden" style="margin-top:10px"></div>

      <div id="imageProof" class="proof-row hidden"></div>
      <div id="result" class="result hidden"></div>
      <div id="resultToolbar" class="toolbar hidden">
        <button id="copy" class="text-btn">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copyLabel">Copy</span>
        </button>
        <button id="insert" class="ghost">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Insert into Figma
        </button>
      </div>
    </div>

    <div id="settingsView" class="hidden">
      <div class="settings-header">
        <button id="closeSettings" class="icon-btn" aria-label="Back to summarizer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>Credentials &amp; model</h1>
      </div>

      <label>Figma personal access token <span class="hint">(needs file_comments:read)</span></label>
      <input id="pat" type="password" placeholder="figd_…" />

      <label>LLM provider</label>
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="local">Local / OpenAI-compatible</option>
      </select>

      <div id="geminiFields">
        <label>Gemini API key</label>
        <input id="geminiKey" type="password" placeholder="AIza…" />
        <label>Model</label>
        <input id="geminiModel" type="text" placeholder="gemini-2.5-pro" />
      </div>

      <div id="localFields" class="hidden">
        <label>Base URL</label>
        <input id="localUrl" type="text" placeholder="http://localhost:11434" />
        <label>Model</label>
        <input id="localModel" type="text" placeholder="llama3.1" />
        <label>API key <span class="hint">(optional)</span></label>
        <input id="localKey" type="password" placeholder="leave blank if not needed" />
      </div>

      <div class="toolbar">
        <button id="test" class="text-btn">Test connection</button>
        <button id="save" class="ghost">Save credentials</button>
      </div>
      <div id="testResult" class="hidden"></div>
      <p id="dataHint" class="hint muted">Your token &amp; LLM key are stored locally in Figma (clientStorage). Comment text is sent to your chosen LLM for summarization — review its provider's data policy.</p>
    </div>
    </div>
    <!-- SCRIPT -->
  </body>
</html>
